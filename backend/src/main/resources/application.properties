spring.application.name=flashcard

# --- Database ---
# Defaults match the local docker-compose PostgreSQL (see compose.yaml).
# Override via environment variables in any non-local environment.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:mydb}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:mypassword}

# The schema is owned by Flyway migrations (src/main/resources/db/migration).
# Hibernate only validates that entities match the migrated schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Security ---
# HS256 signing key, minimum 32 characters. The default is for local development
# only; production deployments MUST set JWT_SECRET.
app.security.jwt.secret=${JWT_SECRET:local-dev-only-jwt-secret-change-me-1234567890}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# Comma-separated list of origins allowed to call the API from a browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# --- Initial admin account (created at startup when no admin exists yet) ---
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:Administrator}

# --- Notifications ---
# Daily spaced-repetition review reminders. Disabled until an email provider is
# configured; when enabled it currently only logs (see LoggingNotificationService).
app.notifications.review-reminders.enabled=${REVIEW_REMINDERS_ENABLED:false}
app.notifications.review-reminders.cron=${REVIEW_REMINDERS_CRON:0 0 8 * * *}

# --- Actuator ---
management.endpoints.web.exposure.include=health
