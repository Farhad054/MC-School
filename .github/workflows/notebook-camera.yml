name: Notebook camera QR integration

on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/notebookcamera/**'
      - 'backend/src/test/java/com/mcschool/flashcard/notebookcamera/**'
      - 'backend/src/main/resources/db/migration/V85__*'
      - 'backend/src/main/java/com/mcschool/flashcard/liveclasses/**'
      - 'backend/src/main/java/com/mcschool/flashcard/config/SecurityConfig.java'
      - 'backend/src/main/java/com/mcschool/flashcard/auth/OnlineClassPilotAuthorizationManager.java'
      - 'backend/src/main/java/com/mcschool/flashcard/users/UserRepository.java'
      - 'frontend/src/features/notebook-camera/**'
      - 'frontend/src/api/notebookCameras*'
      - 'frontend/src/lib/phoneCameraRoute*'
      - 'frontend/public/notebook-camera/**'
      - 'frontend/notebook-camera-tests/**'
      - 'frontend/nginx.conf*'
      - '.github/workflows/notebook-camera.yml'
  push:
    branches: ['codex/notebook-camera-qr']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  camera-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build complete application
        run: npm run build
        working-directory: frontend
      - name: Check phone session lifecycle and public QR entry
        run: npm test -- src/features/notebook-camera src/api/notebookCameras.test.ts src/lib/phoneCameraRoute.test.ts
        working-directory: frontend
      - name: Check geometry, image quality and reference QR matrices
        run: node --test notebook-camera-tests/*.test.mjs
        working-directory: frontend
  camera-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '2'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify HTTP permissions, bounded grants, migration and concurrent single-use claims
        run: ./mvnw -B -ntp '-Dtest=NotebookCamera*,LiveKitMediaProviderTest,OnlineClassPilotAuthorizationManagerTest' test
        working-directory: backend
      - name: Require executed multi-teacher isolation and disabled-feature tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          suites = {
              'NotebookCameraTeacherIsolationIntegrationTest': 10,
              'NotebookCameraDisabledIntegrationTest': 2,
          }
          for name, minimum in suites.items():
              report = Path('backend/target/surefire-reports') / f'TEST-com.mcschool.flashcard.notebookcamera.{name}.xml'
              suite = ElementTree.parse(report).getroot()
              assert int(suite.get('tests', '0')) >= minimum, f'{name}: missing PostgreSQL coverage'
              for count in ('skipped', 'failures', 'errors'):
                  assert int(suite.get(count, '0')) == 0, f'{name}: {count} must be zero'
          PY
