name: Classroom PDF browser tests
on:
  push:
    branches: [integration/railway-and-ux]
    paths:
      - 'frontend/**'
      - '.github/workflows/classroom-pdf-e2e.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/classroom-pdf-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx --yes --package=@playwright/test playwright --version
      - run: npx --yes playwright install --with-deps chromium
      - run: npm run preview -- --host 127.0.0.1 > /tmp/mc-vite.log 2>&1 &
      - run: npx --yes --package=@playwright/test playwright test --config=playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: classroom-pdf-browser-failures
          path: frontend/test-results/
