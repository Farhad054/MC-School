name: Meta funnel validation

on:
  pull_request:
    branches: [integration/railway-and-ux]
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/trialleads/**'
      - 'backend/src/main/resources/db/migration/V98__meta_funnel_outbox.sql'
      - 'backend/src/test/java/com/mcschool/flashcard/trialleads/**'
      - 'frontend/src/api/trialLeads.ts'
      - 'frontend/src/pages/admin/*Leads*'
      - 'frontend/src/pages/admin/SiteVisitsPage.tsx'
      - 'frontend/src/trial-leads.css'
      - '.github/workflows/meta-funnel.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_API_VERSION: '1.44'
      JAVA_TOOL_OPTIONS: '-Dapi.version=1.44'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate normalization, outbox and PostgreSQL concurrency
        working-directory: backend
        run: ./mvnw -B -ntp -Dtest=MetaFunnelServiceTest,MetaFunnelOutboxIntegrationTest,TrialLeadFunnelControllerTest test
      - name: Require PostgreSQL integration tests to run
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('backend/target/surefire-reports/TEST-com.mcschool.flashcard.trialleads.MetaFunnelOutboxIntegrationTest.xml').getroot()
          assert int(report.attrib['tests']) >= 7
          assert int(report.attrib['skipped']) == 0, 'PostgreSQL tests must not be skipped'
          PY
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build admin application
        working-directory: frontend
        run: npm run build
