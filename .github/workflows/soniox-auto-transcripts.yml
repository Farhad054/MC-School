name: Automatic Soniox lesson transcripts

on:
  push:
    branches: [fix/livekit-on-demand-rooms, fix/teacher-unrestricted-reentry]
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/liveclasses/**'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/**'
      - 'backend/src/main/resources/db/migration/V93__store_automatic_soniox_lesson_transcripts.sql'
      - 'backend/src/test/java/com/mcschool/flashcard/liveclasses/**'
      - 'services/transcription-agent/**'
      - 'frontend/src/api/types.ts'
      - 'frontend/src/api/onlineClasses.ts'
      - 'frontend/src/pages/teacher/LessonDetailPage*'
      - 'frontend/src/pages/teacher/StudentLessonHistoryDetailPage*'
      - 'frontend/src/features/online-classes/OnlineClassRoom*'
      - 'frontend/src/features/online-classes/lessonEntry*'
      - 'frontend/src/features/online-classes/LessonEntryAction*'
      - 'frontend/src/features/online-classes/StartOnlineClassButton*'
      - 'frontend/src/features/online-classes/useClassSession*'
      - 'frontend/src/pages/student/StudentLessonsCalendarPage*'
      - '.github/workflows/soniox-auto-transcripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcript-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test transcript startup, visibility and source isolation
        working-directory: frontend
        run: >-
          npm test --
          src/pages/teacher/LessonDetailPage.test.tsx
          src/pages/teacher/StudentLessonHistoryDetailPage.test.tsx
          src/features/online-classes/OnlineClassRoom.test.tsx
          src/features/online-classes/lessonEntry.test.ts
          src/features/online-classes/LessonEntryAction.test.tsx
          src/features/online-classes/StartOnlineClassButton.test.tsx
          src/features/online-classes/useClassSession.test.ts
          src/pages/student/StudentLessonsCalendarPage.test.tsx
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_API_VERSION: "1.44"
      # docker-java reads api.version as a JVM property, including in Surefire's
      # forked test JVM. DOCKER_API_VERSION alone only configures the Docker CLI.
      JAVA_TOOL_OPTIONS: "-Dapi.version=1.44"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run transcript and classroom integration tests (Docker)
        working-directory: backend
        run: ./mvnw -B -ntp -Dtest=LessonEntryPolicyTest,OnlineClassTranscriptIntegrationTest,OnlineClassServiceIntegrationTest,LiveKitAgentTranscriptionProviderTest,OnlineClassObservabilityIntegrationTest test
  soniox-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/transcription-agent/requirements-dev.txt
      - name: Install pinned agent dependencies
        working-directory: services/transcription-agent
        run: pip install -r requirements-dev.txt
      - name: Test agent ingest and dispatch
        working-directory: services/transcription-agent
        run: pytest -q
      - name: Build production agent image
        run: docker build -t soniox-agent:ci services/transcription-agent
      - name: Smoke test production command without provider access
        shell: bash
        run: |
          # Exercise the image's actual default command. With no CLI subcommand
          # LiveKit prints help and exits; unit tests cannot detect that failure.
          container_id=$(docker run -d --network none \
            -e LIVEKIT_URL=wss://127.0.0.1:443 \
            -e LIVEKIT_API_KEY=ci-no-provider-access \
            -e LIVEKIT_API_SECRET=ci-no-provider-access \
            -e LIVEKIT_AGENT_NAME=ci-transcription \
            -e SONIOX_API_KEY=ci-no-provider-access \
            -e MCSCHOOL_API_BASE_URL=http://127.0.0.1:8080/api/v1 \
            -e TRANSCRIPTION_INTERNAL_TOKEN=ci-no-provider-access \
            soniox-agent:ci)
          trap 'docker logs "$container_id"; docker rm -f "$container_id" >/dev/null' EXIT
          healthy=0
          for attempt in {1..30}; do
            test "$(docker inspect -f '{{.State.Running}}' "$container_id")" = true
            if docker exec "$container_id" python -c \
              "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2).status == 200"; then
              healthy=$((healthy + 1))
              # Stay up across multiple checks so an early import/configuration
              # crash cannot pass on a briefly available health endpoint.
              if test "$healthy" -ge 5; then
                exit 0
              fi
            else
              healthy=0
            fi
            sleep 2
          done
          echo 'Production agent did not remain healthy' >&2
          exit 1
