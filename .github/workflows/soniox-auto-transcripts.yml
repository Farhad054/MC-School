name: Automatic Soniox lesson transcripts

on:
  push:
    branches: [feature/automatic-soniox-lesson-transcripts-20261102]
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/liveclasses/**'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/**'
      - 'backend/src/main/resources/db/migration/V93__store_automatic_soniox_lesson_transcripts.sql'
      - 'backend/src/test/java/com/mcschool/flashcard/liveclasses/**'
      - 'services/transcription-agent/**'
      - '.github/workflows/soniox-auto-transcripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_API_VERSION: "1.44"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Configure Testcontainers Docker client API compatibility
        run: printf 'api.version=1.44\\n' > "$HOME/.docker-java.properties"
      - name: Run transcript and classroom integration tests (Docker)
        working-directory: backend
        run: ./mvnw -B -ntp -Dtest=OnlineClassTranscriptIntegrationTest,OnlineClassServiceIntegrationTest test
  soniox-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/transcription-agent/requirements-dev.txt
      - name: Install pinned agent dependencies
        working-directory: services/transcription-agent
        run: pip install -r requirements-dev.txt
      - name: Test agent ingest and dispatch
        working-directory: services/transcription-agent
        run: pytest -q
