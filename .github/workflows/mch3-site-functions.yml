name: MCH3 website functions

on:
  pull_request:
    paths:
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/**Mcp*'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/Mcp*'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/LessonTranscript*'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/WorkbookGenerationJobService.java'
      - 'backend/src/main/java/com/mcschool/flashcard/lessons/PersonalWorkbookDraftService.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/WorkbookTeacherWorkflowTest.java'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/WorkbookDraftDownloadServiceTest.java'
      - 'backend/src/main/resources/db/migration/V102__*'
      - 'backend/src/main/java/com/mcschool/flashcard/auth/Mcp*'
      - 'backend/src/test/java/com/mcschool/flashcard/lessons/*Mcp*'
      - 'backend/src/main/resources/db/migration/V91__*'
      - 'backend/src/main/resources/mcp/teacher-guide.json'
      - 'backend/src/main/resources/mcp/teacher-guide-images/**'
      - 'backend/src/main/resources/mcp/teacher-guide-gallery.html'
      - '.github/scripts/mch3-teacher-guide.test.cjs'
      - 'docs/teacher-guide-visuals/**'
      - 'docs/mch3-teacher-guide.md'
      - '.github/workflows/mch3-site-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-authorization-scheduling:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: '2'
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check teacher guide presentation and host compatibility
        run: node .github/scripts/mch3-teacher-guide.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Check real MCP transport, role isolation, durable retries and native schedule
        run: ./mvnw -B -ntp '-Dtest=Mcp*,*McpServiceTest,MindcraftiMcpContentAdviceTest,WorkbookTeacherWorkflowTest,WorkbookDraftDownloadServiceTest' test
        working-directory: backend
      - name: Require executed PostgreSQL and HTTP security regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          suites = {
              'McpOperationReceiptIntegrationTest': 13,
              'McpWorkbookJobIntegrationTest': 6,
              'McpLessonSchedulePersistenceIntegrationTest': 4,
              'McpSiteFunctionsTransportIntegrationTest': 17,
              'McpLessonTranscriptReadServiceTest': 16,
          }
          for name, minimum in suites.items():
              report = Path('backend/target/surefire-reports') / f'TEST-com.mcschool.flashcard.lessons.{name}.xml'
              suite = ElementTree.parse(report).getroot()
              assert int(suite.get('tests', '0')) >= minimum, f'{name}: missing PostgreSQL coverage'
              for count in ('skipped', 'failures', 'errors'):
                  assert int(suite.get(count, '0')) == 0, f'{name}: {count} must be zero'
          PY
      - name: Package complete backend
        run: ./mvnw -B -ntp -DskipTests package
        working-directory: backend
