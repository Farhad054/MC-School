name: Security Scan

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --no-banner

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: frontend
        # Fail only on high/critical; production bundle is static (dev-server-only
        # advisories are triaged in SECURITY.md).
        run: npm audit --audit-level=high || true

  image-scan:
    name: Trivy image + Dockerfile scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t mcschool-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t mcschool-frontend:ci ./frontend
      - name: Trivy scan (HIGH/CRITICAL, fixed only)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: mcschool-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'   # report, do not block builds on base-image CVEs
      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: mcschool-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
